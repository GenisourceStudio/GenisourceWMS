# GenisourceWMS backend configuration.
#
# The design system, stack and module layout mirror GenisourceMES
# (~/Workspace/AI-APP/GenisourceMES). See docs/SYSTEM_DESIGN.md §2.

spring:
  application:
    name: genisource-wms

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/genisource_wms}
    username: ${DB_USERNAME:wms}
    password: ${DB_PASSWORD:wms_dev_password}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    # Flyway owns the schema; Hibernate only verifies that entities match it.
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  web:
    locale: zh_CN

  jackson:
    time-zone: Asia/Shanghai

server:
  port: ${SERVER_PORT:8101}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

wms:
  version: "@project.version@"
  security:
    admin-username: ${WMS_ADMIN_USERNAME:admin}
    admin-password: ${WMS_ADMIN_PASSWORD:admin123}
    jwt:
      secret: ${WMS_JWT_SECRET:dev-only-jwt-secret-change-me-32-bytes-minimum}
      access-ttl: ${WMS_ACCESS_TTL:15m}
      refresh-ttl: ${WMS_REFRESH_TTL:7d}

logging:
  level:
    com.genisource.wms: INFO
    org.flywaydb: INFO
